<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal OS v3.7</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        .terminal-container {
            display: flex; flex-direction: column;
            width: 100%; height: 100%;
            box-sizing: border-box;
            padding: 15px;
            overflow: hidden;
            min-width: 0;
        }

        .output {
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.4;
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 10px;
            min-width: 0;
            max-width: 100%;
        }

        .quick-buttons {
            display: none;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px 0;
            border-top: 1px solid #222;
            max-height: 90px;
            overflow-y: auto;
        }
        .quick-buttons.visible { display: flex; }
        .quick-buttons button {
            padding: 3px 8px;
            font-size: 11px;
            margin: 0;
            border-color: #ff8800;
            color: #ff8800;
            background: rgba(255, 136, 0, 0.05);
        }
        .quick-buttons button:hover {
            background-color: #ff8800;
            color: #000;
        }

        .input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid #222;
            padding-top: 10px;
            background-color: #000000;
            min-width: 0;
            overflow: hidden;
            flex-wrap: nowrap;
        }

        .prompt {
            color: #00ff00;
            margin-right: 5px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        input[type="text"], input[type="password"] {
            background-color: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            flex-grow: 1;
            flex-shrink: 1;
            outline: none;
            min-width: 0;
            width: 100%;
        }

        button {
            background-color: transparent;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 4px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            cursor: pointer;
            margin-left: 10px;
            flex-shrink: 0;
        }

        button:hover { background-color: #00ff00; color: #000000; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .yellow-link {
            color: #ffff00;
            text-decoration: underline;
            cursor: pointer;
        }
        .yellow-link:hover { color: #ffffff; }

        .pumpkin {
            position: fixed;
            font-size: 42px;
            cursor: pointer;
            z-index: 500;
            user-select: none;
            animation: pumpkinPulse 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255, 136, 0, 0.7));
            transition: transform 0.15s;
        }
        .pumpkin:hover { transform: scale(1.2) rotate(10deg); }
        @keyframes pumpkinPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .floating-text {
            position: fixed;
            color: #ff8800;
            font-weight: bold;
            pointer-events: none;
            font-size: 20px;
            z-index: 600;
            text-shadow: 0 0 6px rgba(255, 136, 0, 0.8);
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-60px); opacity: 0; }
        }

        .halloween-badge {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(255, 136, 0, 0.15);
            border: 1px solid #ff8800;
            color: #ff8800;
            padding: 4px 10px;
            font-size: 13px;
            z-index: 500;
            border-radius: 3px;
        }

        .auth-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #000000;
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .auth-overlay.hidden { display: none; }

        .auth-box {
            border: 2px solid #00ff00;
            padding: 25px;
            width: 100%; max-width: 400px;
            background-color: #000000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }
        .auth-title {
            text-align: center; font-size: 18px; margin-bottom: 8px;
            color: #00ff00; font-weight: bold; letter-spacing: 1px;
        }
        .auth-subtitle {
            text-align: center; font-size: 12px;
            color: #ff8800; margin-bottom: 20px;
        }
        .auth-tabs { display: flex; margin-bottom: 18px; gap: 5px; }
        .auth-tab {
            flex: 1; background: transparent;
            border: 1px solid #00ff00; color: #00ff00;
            padding: 8px; cursor: pointer;
            font-family: inherit; font-size: 13px; margin: 0;
        }
        .auth-tab.active { background-color: #00ff00; color: #000; }
        .auth-form label {
            display: block; margin-top: 12px;
            margin-bottom: 4px; color: #00ff00; font-size: 13px;
        }
        .auth-form input {
            width: 100%; background: transparent;
            border: 1px solid #00ff00; color: #00ff00;
            padding: 8px 10px; font-family: inherit;
            font-size: 14px; box-sizing: border-box; outline: none;
        }
        .auth-form input:focus { border-color: #ffff00; }
        .auth-form button {
            margin-top: 18px; width: 100%; padding: 10px;
            background: transparent; border: 1px solid #00ff00;
            color: #00ff00; font-family: inherit; font-size: 14px;
            cursor: pointer; margin-left: 0;
        }
        .auth-form button:hover:not(:disabled) { background-color: #00ff00; color: #000; }
        .auth-error {
            color: #ff4444; margin-top: 12px;
            font-size: 13px; min-height: 18px; text-align: center;
        }
        .auth-hint {
            color: #666; font-size: 11px;
            margin-top: 14px; text-align: center; line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="halloweenBadge" class="halloween-badge" style="display:none;">🎃 <span id="halloweenCoinsDisplay">0</span></div>

<div id="authOverlay" class="auth-overlay">
    <div class="auth-box">
        <div class="auth-title">TERMINAL OS v3.7</div>
        <div class="auth-subtitle">// СИСТЕМА АВТОРИЗАЦИИ ХАКЕРОВ // HALLOWEEN 🎃</div>

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">ВОЙТИ</button>
            <button type="button" class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">РЕГИСТРАЦИЯ</button>
        </div>

        <div id="loginForm" class="auth-form">
            <label>Ник:</label>
            <input type="text" id="loginNick" maxlength="20" autocomplete="off" placeholder="Введите ваш ник">
            <label>Пароль:</label>
            <input type="password" id="loginPass" maxlength="30" placeholder="Введите пароль">
            <button type="button" onclick="loginUser()" id="loginBtn">ВОЙТИ В СИСТЕМУ</button>
            <div id="loginError" class="auth-error"></div>
        </div>

        <div id="registerForm" class="auth-form" style="display:none;">
            <label>Ник:</label>
            <input type="text" id="regNick" maxlength="20" autocomplete="off" placeholder="От 3 до 20 символов">
            <label>Пароль:</label>
            <input type="password" id="regPass" maxlength="30" placeholder="От 6 символов">
            <label>Повтор пароля:</label>
            <input type="password" id="regPass2" maxlength="30" placeholder="Повторите пароль">
            <button type="button" onclick="registerUser()" id="regBtn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
            <div id="registerError" class="auth-error"></div>
        </div>

        <div class="auth-hint">
            Прогресс сохраняется в облаке Firebase.<br>
            🎃 Halloween Event активен!
        </div>
    </div>
</div>

<div class="terminal-container">
    <div class="output" id="output"></div>
    <div class="quick-buttons" id="quickButtons"></div>
    <div class="input-line">
        <span class="prompt" id="promptLabel">guest@cyber:~$</span>
        <input type="text" id="commandInput" placeholder="" autocomplete="off">
        <button onclick="processCommand()">ОТПРАВИТЬ</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import {
        getAuth, createUserWithEmailAndPassword,
        signInWithEmailAndPassword, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    import {
        getFirestore, doc, setDoc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCo2CwI1oroa7I_NdSWq-pXOyAh5I62M08",
        authDomain: "hacker-simulator-v3-7.firebaseapp.com",
        projectId: "hacker-simulator-v3-7",
        storageBucket: "hacker-simulator-v3-7.firebasestorage.app",
        messagingSenderId: "846751803744",
        appId: "1:846751803744:web:e0a87abc9ba454e8525605"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const EMAIL_SUFFIX = "@terminal-os.local";

    const outputDiv = document.getElementById('output');
    const inputField = document.getElementById('commandInput');
    const promptLabel = document.getElementById('promptLabel');
    const quickButtonsDiv = document.getElementById('quickButtons');
    const halloweenBadge = document.getElementById('halloweenBadge');
    const halloweenCoinsDisplay = document.getElementById('halloweenCoinsDisplay');

    inputField.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            window.processCommand();
        }
    });

    // ===== ИГРОВОЕ СОСТОЯНИЕ =====
    let currentUser = null;
    let currentUserUID = null;

    let balance = 0;
    let policeRisk = 50;
    let upgradeCost = 100;
    let currentTarget = null;
    let generatedPassword1 = "";
    let playerLevel = 1;
    let playerXP = 0;
    const xpNeededForLevel = 100;
    let isWanted = false;
    let clearCost = 80;
    let currentPC = "Базовый терминал";
    let scanDelay = 3000;
    let policeDiscount = 0;
    let policeRiskBonus = 0;
    let doubleScan = false;
    let totalCracked = 0;
    let totalCrackedServers = [];
    let totalEarned = 0;
    let discoveredServers = [];
    let earnedMedals = [];
    let playTimeSeconds = 0;
    const GAMER_2026_TIME = 15 * 60 * 60;
    let currentAvatarId = 1;

    // ===== HALLOWEEN =====
    let halloweenCoins = 0;
    let hasHalloweenPC = false;
    let hasKeyboard = false;
    let hasKeyboardUltra = false;

    // ===== АВАТАРКИ =====
    const avatars = [
        { id: 1, name: "Хакер", art: `   ▄▄▄▄▄▄▄
  █ ▄▄▄▄▄ █
  █ █▀▀▀█ █
  █ █▄▄▄█ █
  █▄▄▄▄▄▄▄█
   ▀█▀ ▀█▀` },
        { id: 2, name: "Череп", art: `   ▄▄▄▄▄▄▄
  █▀▀▀▀▀▀▀█
  █ ▄▄ ▄▄ █
  █ ▀▀ ▀▀ █
  █▄▄▄▄▄▄▄█
    █ █` },
        { id: 3, name: "Призрак", art: `   ▄▄▄▄▄▄▄
  █ ▀▀▀▀▀ █
  █ █ █ █ █
  █ ▀▀▀▀▀ █
  █▄▄▄▄▄▄▄█
   ▀▀ ▀▀ ▀` },
        { id: 4, name: "Робот", art: `  ┌───────┐
  │ ●   ● │
  │  ───  │
  │ ▓▓▓▓▓ │
  └───────┘
   └─┘ └─┘` },
        { id: 5, name: "Кот", art: `   /\\_/\\
  ( o.o )
   > ^ <
  /|   |\\
 (_|   |_)` },
        { id: 6, name: "Матрица", art: `  01001101
  10110010
  01101001
  11010011
  00101101
  10010110` },
        { id: 7, name: "Тыква", art: `    🎃
   (   )
    \\_/` }
    ];

    function getCurrentAvatar() {
        return avatars.find(a => a.id === currentAvatarId) || avatars[0];
    }

    // ===== МЕДАЛИ =====
    const medalDefs = {
        best_cracker: { id: "best_cracker", name: "Best Cracker", icon: "🏆", desc: "Взломать самый дорогой сервер" },
        millioner:    { id: "millioner",    name: "Millioner",    icon: "💰", desc: "Заработать $100,000 за всё время" },
        fifty:        { id: "fifty",        name: "Fifty",        icon: "🎖️", desc: "Достичь 50 уровня" },
        one_hundred:  { id: "one_hundred",  name: "One Hundred!", icon: "👑", desc: "Достичь 100 уровня" },
        gamer_2026:   { id: "gamer_2026",   name: "Gamer 2026",   icon: "🎮", desc: "Провести в игре 15 часов" },
        pumpkin_hunter: { id: "pumpkin_hunter", name: "Pumpkin Hunter", icon: "🎃", desc: "Собрать 50 Halloween-монет" }
    };

    // ===== ПК =====
    const pcMarket = [
        { id: 1, name: "Cyber-Pulse v2",    price: 700,  desc: "Ускоряет scan в 2 раза" },
        { id: 2, name: "Ghost-Node 400",    price: 1500, desc: "Снижает риск полиции на 10%" },
        { id: 3, name: "Quantum-X Phantom", price: 2000, desc: "Сканирует сразу 2 сервера за раз" }
    ];

    function applyPCEffect(pcName) {
        scanDelay = 3000; policeRiskBonus = 0; doubleScan = false;
        if (pcName === "Cyber-Pulse v2") scanDelay = 1500;
        else if (pcName === "Ghost-Node 400") policeRiskBonus = 10;
        else if (pcName === "Quantum-X Phantom") doubleScan = true;

        if (hasHalloweenPC) scanDelay = 100;
    }

    // ===== СЕРВЕРА =====
    const servers = {
        'simple':       { name: 'simple',       reward: 50,   risk: 10, desc: 'Домашний роутер соседа' },
        'guest_wifi':   { name: 'guest_wifi',   reward: 70,   risk: 15, desc: 'Открытая точка Wi-Fi кафе' },
        'school_pc':    { name: 'school_pc',    reward: 90,   risk: 15, desc: 'Школьный компьютер' },
        'old_forum':    { name: 'old_forum',    reward: 120,  risk: 18, desc: 'Заброшенный форум 2008 года' },
        'shop_online':  { name: 'shop_online',  reward: 150,  risk: 20, desc: 'Интернет-магазин техники' },
        'game_server':  { name: 'game_server',  reward: 180,  risk: 22, desc: 'Игровой сервер Minecraft' },
        'streamer_pc':  { name: 'streamer_pc',  reward: 200,  risk: 25, desc: 'ПК популярного стримера' },
        'hacker_forum': { name: 'hacker_forum', reward: 300,  risk: 35, desc: 'Закрытый хакерский форум' },
        'crypto_bank':  { name: 'crypto_bank',  reward: 400,  risk: 40, desc: 'Криптовалютная биржа' },
        'dating_app':   { name: 'dating_app',   reward: 500,  risk: 45, desc: 'Сервис знакомств' },
        'corp_mail':    { name: 'corp_mail',    reward: 650,  risk: 55, desc: 'Почта корпорации' },
        'med_clinic':   { name: 'med_clinic',   reward: 800,  risk: 60, desc: 'База данных клиники' },
        'mainframe':    { name: 'mainframe',    reward: 1000, risk: 75, desc: 'Главный сервер дата-центра' },
        'bank_core':    { name: 'bank_core',    reward: 1500, risk: 80, desc: 'Ядро банковской системы' },
        'gov_db':       { name: 'gov_db',       reward: 2000, risk: 85, desc: 'Правительственная база' },
        'military_net': { name: 'military_net', reward: 3000, risk: 95, desc: 'Военная сеть (ОЧЕНЬ опасно)' }
    };

    // ===== СОСТОЯНИЕ =====
    function getCurrentGameState() {
        return {
            balance, policeRisk, upgradeCost, playerLevel, playerXP,
            isWanted, clearCost, currentPC, scanDelay, policeDiscount,
            policeRiskBonus, doubleScan,
            totalCracked, totalEarned,
            earnedMedals, playTimeSeconds, totalCrackedServers,
            discoveredServers, currentAvatarId,
            halloweenCoins, hasHalloweenPC, hasKeyboard, hasKeyboardUltra
        };
    }

    // Загрузка состояния с поддержкой миграции со старых версий
    function applyGameState(s) {
        if (!s) return;

        // Основные (есть во всех версиях)
        balance = s.balance ?? 0;
        policeRisk = s.policeRisk ?? 50;
        upgradeCost = s.upgradeCost ?? 100;
        playerLevel = s.playerLevel ?? 1;
        playerXP = s.playerXP ?? 0;
        isWanted = s.isWanted ?? false;
        clearCost = s.clearCost ?? 80;
        currentPC = s.currentPC ?? "Базовый терминал";
        policeDiscount = s.policeDiscount ?? 0;
        totalCracked = s.totalCracked ?? 0;
        totalEarned = s.totalEarned ?? 0;
        earnedMedals = s.earnedMedals ?? [];
        playTimeSeconds = s.playTimeSeconds ?? 0;
        totalCrackedServers = s.totalCrackedServers ?? [];
        discoveredServers = s.discoveredServers ?? [];
        currentAvatarId = s.currentAvatarId ?? 1;

        // Halloween-поля (только в новых версиях) — по умолчанию 0/false
        halloweenCoins = s.halloweenCoins ?? 0;
        hasHalloweenPC = s.hasHalloweenPC ?? false;
        hasKeyboard = s.hasKeyboard ?? false;
        hasKeyboardUltra = s.hasKeyboardUltra ?? false;

        applyPCEffect(currentPC);
        updateHalloweenBadge();
        updateQuickButtons();
    }

    function resetGameState() {
        balance = 0; policeRisk = 50; upgradeCost = 100;
        playerLevel = 1; playerXP = 0; isWanted = false; clearCost = 80;
        currentPC = "Базовый терминал";
        policeDiscount = 0;
        totalCracked = 0; totalEarned = 0; currentTarget = null;
        totalCrackedServers = []; earnedMedals = [];
        discoveredServers = [];
        playTimeSeconds = 0; currentAvatarId = 1;
        generatedPassword1 = "";
        halloweenCoins = 0;
        hasHalloweenPC = false;
        hasKeyboard = false;
        hasKeyboardUltra = false;
        applyPCEffect(currentPC);
        updateHalloweenBadge();
        updateQuickButtons();
    }

    // ===== СОХРАНЕНИЕ =====
    async function saveGame(silent = false) {
        if (!currentUserUID) {
            if (!silent) printToTerminal("[ОШИБКА] Вы не авторизованы.");
            return false;
        }
        try {
            await setDoc(doc(db, "users", currentUserUID), {
                nickname: currentUser,
                gameState: getCurrentGameState(),
                lastSave: new Date().toISOString(),
                version: "3.7"
            }, { merge: true });
            if (!silent) printToTerminal(`[СОХРАНЕНИЕ] Прогресс сохранён. Баланс: $${balance} | 🎃 ${halloweenCoins}`);
            return true;
        } catch (e) {
            console.error(e);
            if (!silent) printToTerminal(`[ОШИБКА] ${e.message}`);
            return false;
        }
    }

    async function resetGame() {
        resetGameState();
        await saveGame(true);
        printToTerminal("[СБРОС] Прогресс аккаунта удалён.");
    }

    // ===== МЕДАЛИ =====
    function checkMedals() {
        const newMedals = [];
        if (!earnedMedals.includes("best_cracker") && totalCrackedServers.includes("military_net")) {
            earnedMedals.push("best_cracker"); newMedals.push(medalDefs.best_cracker);
        }
        if (!earnedMedals.includes("millioner") && totalEarned >= 100000) {
            earnedMedals.push("millioner"); newMedals.push(medalDefs.millioner);
        }
        if (!earnedMedals.includes("fifty") && playerLevel >= 50) {
            earnedMedals.push("fifty"); newMedals.push(medalDefs.fifty);
        }
        if (!earnedMedals.includes("one_hundred") && playerLevel >= 100) {
            earnedMedals.push("one_hundred"); newMedals.push(medalDefs.one_hundred);
        }
        if (!earnedMedals.includes("gamer_2026") && playTimeSeconds >= GAMER_2026_TIME) {
            earnedMedals.push("gamer_2026"); newMedals.push(medalDefs.gamer_2026);
        }
        if (!earnedMedals.includes("pumpkin_hunter") && halloweenCoins >= 50) {
            earnedMedals.push("pumpkin_hunter"); newMedals.push(medalDefs.pumpkin_hunter);
        }
        newMedals.forEach(m => {
            printToTerminal(`\n<span style="color:#ff8800;font-weight:bold;">🎉 ПОЛУЧЕНА МЕДАЛЬ: ${m.icon} ${m.name}!</span>\n<span style="color:#aaaaaa;">${m.desc}</span>`);
        });
        return newMedals.length > 0;
    }

    // ===== УТИЛИТЫ =====
    function printToTerminal(text) {
        outputDiv.innerHTML += text + "\n\n";
        outputDiv.scrollTop = outputDiv.scrollHeight;
    }

    function generateRandomPassword() {
        return Math.random().toString(36).substring(2, 7).toUpperCase();
    }

    function showHiddenPassword() {
        if (!currentTarget) {
            printToTerminal("Ошибка: Цель не выбрана. Используйте target.");
            return;
        }
        generatedPassword1 = generateRandomPassword();
        let html = `[СОЕДИНЕНИЕ] Успешное подключение...\n`;
        html += `[БРАУЗЕР]: http://${currentTarget.name}.net/login/admin\n`;
        html += `--------------------------------------------------\n`;
        html += `[ДАННЫЕ]: Скрытый токен: <strong style="color:#ffffff;">${generatedPassword1}</strong>\n`;
        html += `--------------------------------------------------\n`;
        html += `Введите: crack [пароль]`;
        printToTerminal(html);
    }
    window.showHiddenPassword = showHiddenPassword;

    // ===== HALLOWEEN: ТЫКВЫ =====
    let pumpkinInterval = null;
    let gameActive = false;

    function spawnPumpkin() {
        if (!gameActive) return;
        if (document.querySelectorAll('.pumpkin').length >= 3) return;

        const pumpkin = document.createElement('div');
        pumpkin.className = 'pumpkin';
        pumpkin.textContent = '🎃';

        const w = window.innerWidth;
        const h = window.innerHeight;
        const padding = 60;
        const bottomReserve = 140;

        const x = padding + Math.random() * Math.max(50, w - padding * 2);

    window.switchAuthTab = function(tab) {

        const tabRegister = document.getElementById('tabRegister');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        document.getElementById('loginError').textContent = '';

        if (tab === 'login') {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            document.getElementById('loginNick').focus();
        } else {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            registerForm.style.display = 'block';
            loginForm.style.display = 'none';
            document.getElementById('regNick').focus();
        }

    function showError(form, text) {
        document.getElementById(form + 'Error').textContent = text;
    }

    window.registerUser = async function() {
        const nick = document.getElementById('regNick').value.trim();
        const pass = document.getElementById('regPass').value;
        const pass2 = document.getElementById('regPass2').value;
        showError('register', '');

        if (nick.length < 3 || nick.length > 20) { showError('register', 'Ник 3–20 символов'); return; }
        if (!/^[a-zA-Zа-яА-Я0-9_]+$/.test(nick)) { showError('register', 'Только буквы, цифры и _'); return; }
        if (pass.length < 6) { showError('register', 'Пароль минимум 6 символов'); return; }
        if (pass !== pass2) { showError('register', 'Пароли не совпадают'); return; }

        const email = nick.toLowerCase() + EMAIL_SUFFIX;
        const btn = document.getElementById('regBtn');
        btn.disabled = true;
        btn.textContent = 'РЕГИСТРАЦИЯ...';

        try {
            const cred = await createUserWithEmailAndPassword(auth, email, pass);
            await setDoc(doc(db, "users", cred.user.uid), {
                nickname: nick,
                gameState: null,
                createdAt: new Date().toISOString(),
                version: "3.7"
            });
            console.log("✓ Аккаунт создан:", cred.user.uid);
        } catch (e) {
            console.error(e);
            let msg = e.message;
            if (e.code === 'auth/email-already-in-use') msg = 'Этот ник уже занят';
            if (e.code === 'auth/weak-password') msg = 'Пароль слишком слабый';
            showError('register', msg);
        } finally {
            btn.disabled = false;
            btn.textContent = 'ЗАРЕГИСТРИРОВАТЬСЯ';
        }
    };

    window.loginUser = async function() {
        const nick = document.getElementById('loginNick').value.trim();
        const pass = document.getElementById('loginPass').value;
        showError('login', '');
        if (!nick || !pass) { showError('login', 'Заполните все поля'); return; }

        const email = nick.toLowerCase() + EMAIL_SUFFIX;
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'ВХОД...';

        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (e) {
            console.error(e);
            let msg = 'Неверный ник или пароль';
            if (e.code === 'auth/too-many-requests') msg = 'Слишком много попыток. Подождите.';
            if (e.code === 'auth/network-request-failed') msg = 'Нет подключения к интернету';
            showError('login', msg);
        } finally {
            btn.disabled = false;
            btn.textContent = 'ВОЙТИ В СИСТЕМУ';
        }
    };

        else if (cmd === 'logout') logoutUser();
        else {
            printToTerminal(`Команда '${cmd}' не найдена. Введите 'help'.`);
        }
    };

    // ===== ОТСЛЕЖИВАНИЕ АВТОРИЗАЦИИ =====
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserUID = user.uid;
            try {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentUser = data.nickname || user.email.split('@')[0];
                    if (data.gameState) {
                        applyGameState(data.gameState);
                    } else {
                        resetGameState();
                    }
                } else {
                    currentUser = user.email.split('@')[0];
                    resetGameState();
                }
                hideAuthOverlay();
                startGameUI();
            } catch (e) {
                console.error(e);
                showError('login', 'Ошибка загрузки данных');
            }
        } else {
            currentUser = null;
            currentUserUID = null;
            stopPumpkinSpawner();
            outputDiv.innerHTML = '';
            quickButtonsDiv.innerHTML = '';
            quickButtonsDiv.classList.remove('visible');
            halloweenBadge.style.display = 'none';
            showAuthOverlay();
        }
    });

    // ===== ТАЙМЕР ВРЕМЕНИ =====
    setInterval(() => {
        if (!currentUser) return;
        playTimeSeconds += 1;
        if (playTimeSeconds % 600 === 0) {
            checkMedals();
            saveGame(true);
        }
    }, 1000);

    // ===== СОХРАНЕНИЕ ПРИ ЗАКРЫТИИ =====
    window.addEventListener('beforeunload', () => {
        if (currentUserUID) saveGame(true);
    });
</script>

</body>
